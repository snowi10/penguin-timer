<!DOCTYPE>
    <html>
        <head>
            <link rel="stylesheet" href="styles.css"/>

            <meta charset="UTF-8"/>
            <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'"
            />
            <meta
              http-equiv="X-Content-Security-Policy"
              content="default-src 'self'; script-src 'self'"
            />

            <title>Penguin Timer</title> 
        </head>

        <body>
            <!-- The timer. -->
            <div id="timer">
                <!-- The images used. -->
                <img id ="penguin-img" src="assets/blue-penguins.png"/>
                <img id ="clock-img" src="assets/clock-frame.png"/>

                <!-- Displays the digital time. -->
                <!-- Defaults to the current time. -->
                <p id="digits"></p>

                <!-- TODO: Work on implementing these. -->
                <!-- Adjusts the hours. -->
                <button 
                    id ="hour-penguin" 
                    type="button" 
                    onclick="alert('This is the hour penguin')">
                </button>

                <!-- Adjusts the minutes. -->
                <button 
                    id ="minute-penguin" 
                    type="button" 
                    onclick="alert('This is the minute penguin')">
                </button>

                <!-- Adjusts the seconds. -->
                <button
                    id="second-penguin"
                    type="button"
                    onclick="alert('This is the second penguin')">
                </button>
            </div>
       </body>

       <!-- JavaScript file. -->
        <script src="./renderer.js"></script>
    </html>
