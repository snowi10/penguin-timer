<!DOCTYPE>
    <html>
        <head>
            <link rel="stylesheet" href="styles.css"/>
            <meta charset="UTF-8"/>
            <title>Penguin Timer</title> 
        </head>
        <body>
            <div id="timer">
                <img id ="penguin-img" src="assets/blue-penguins.png"/>
                <img id ="clock-img" src="assets/clock-frame.png"/>
                <p id="digits">00:00:00</p>
                <button 
                    id ="hour-penguin" 
                    type="button" 
                    onclick="alert('This is the hour penguin')">
                </button>
                <button 
                    id ="minute-penguin" 
                    type="button" 
                    onclick="alert('This is the minute penguin')">
                </button>
                <button
                    id="second-penguin"
                    type="button"
                    onclick="alert('This is the second penguin')">
                </button>
            </div>
       </body>
        <script src="main.js"></script>
    </html>
